name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -extldflags '-static' -X main.version=${VERSION}"
          
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/ralph-linux-amd64 .
          
          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/ralph-linux-arm64 .
          
          # macOS AMD64
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/ralph-darwin-amd64 .
          
          # macOS ARM64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/ralph-darwin-arm64 .
          
          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/ralph-windows-amd64.exe .

      - name: Create checksums
        run: |
          cd dist
          sha256sum ralph-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ralph-linux-amd64
            dist/ralph-linux-arm64
            dist/ralph-darwin-amd64
            dist/ralph-darwin-arm64
            dist/ralph-windows-amd64.exe
            dist/checksums.txt
          generate_release_notes: true
